<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ZCode Sec Test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head><body>
<h3>web-app-ext probe</h3>
<script>
const tg = window.Telegram.WebApp;
tg.ready();
const log = (m) => { document.body.insertAdjacentHTML('beforeend', '<div>' + m + '</div>'); };
log('initData=' + (tg.initData || '').slice(0, 80));
// THE TEST: downloadFile with an ATTACKER-CHOSEN URL (this is what a malicious bot's mini app could do)
if (tg.downloadFile) {
  log('downloadFile available');
  try {
    const res = tg.downloadFile('https://webhook.site/74aa897d-5aac-4477-890c-179212c5e77b/probe.png', {});
    log('downloadFile returned: ' + JSON.stringify(res).slice(0, 120));
  } catch (e) { log('downloadFile threw: ' + e); }
} else {
  log('NO downloadFile method in this WebView bridge version');
}
if (tg.requestFile) { log('requestFile available'); }
</script>
</body></html>
